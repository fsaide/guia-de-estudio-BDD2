<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario - Bases de Datos 2</title>
    <link rel="stylesheet" href="static/quiz-style.css?v=8">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="quiz-page dark-mode" data-default-theme="dark">

<div class="container">
    <div class="quiz-header">
        <a href="index.html" class="btn btn-secondary">← Volver al Inicio</a>
        <nav class="quiz-breadcrumb" aria-label="Migas de pan">
            <a href="summary.html">Guía</a><span aria-hidden="true">/</span><span>BD2</span><span aria-hidden="true">/</span><span aria-current="page">Autoevaluación</span>
        </nav>
        <div class="theme-switch-wrapper">
            <label class="theme-switch" for="checkbox">
                <input type="checkbox" id="checkbox" checked />
                <div class="slider round"></div>
            </label>
        </div>
    </div>

    <p class="quiz-kicker">Autoevaluación · Bases de Datos II</p>
    <h2>Cuestionario aleatorio</h2>
    <p id="quiz-description">12 preguntas: dos de cada tema.</p>

    <div class="difficulty-toolbar" aria-label="Niveles de dificultad">
        <button class="difficulty-btn active" type="button" data-difficulty="all">Todos</button>
        <button class="difficulty-btn" type="button" data-difficulty="easy">Fácil</button>
        <button class="difficulty-btn" type="button" data-difficulty="medium">Intermedio</button>
        <button class="difficulty-btn" type="button" data-difficulty="advanced">Avanzado</button>
    </div>

    <form id="quiz-form"></form>

    <div class="quiz-controls">
        <button type="button" class="btn" onclick="submitQuiz()">Corregir Cuestionario</button>
        <button type="button" class="btn btn-secondary" onclick="generateQuiz()">Crear otro cuestionario</button>
    </div>

    <div id="results" role="status" aria-live="polite"></div>
</div>

<script src="static/script.js"></script>

</body>
</html>
